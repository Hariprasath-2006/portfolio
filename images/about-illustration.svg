<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7EB3"/>
      <stop offset="50%" stop-color="#8E6BF0"/>
      <stop offset="100%" stop-color="#5B7FFF"/>
    </linearGradient>
    <linearGradient id="avatarGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="400" fill="url(#bgGrad3)"/>

  <!-- soft glow behind avatar -->
  <circle cx="200" cy="210" r="150" fill="#ffffff" opacity="0.08"/>

  <!-- orbit guide ring -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- orbiting skill icons, bright and saturated -->
  <g id="orbitGroup">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(200,70)">
      <circle r="18" fill="#FFD93D"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="14" fill="#1d1633">{}</text>
    </g>
    <g transform="translate(330,200)">
      <circle r="18" fill="#00D2A0"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="13" fill="#1d1633">&lt;/&gt;</text>
    </g>
    <g transform="translate(200,330)">
      <circle r="18" fill="#7EE8FA"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="13" fill="#1d1633">py</text>
    </g>
    <g transform="translate(70,200)">
      <circle r="18" fill="#FF9FE5"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="13" fill="#1d1633">js</text>
    </g>
  </g>

  <!-- sparkle accents -->
  <g fill="#ffffff">
    <circle cx="80" cy="90" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="330" r="3">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="345" cy="90" r="2.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- central abstract avatar, floats gently -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="3.5s" repeatCount="indefinite"/>

    <!-- shoulders -->
    <path d="M 130 300 Q 200 245 270 300 L 270 335 Q 200 305 130 335 Z" fill="url(#avatarGrad2)"/>
    <!-- head -->
    <circle cx="200" cy="205" r="55" fill="url(#avatarGrad2)"/>
    <!-- abstract accent, not a facial likeness -->
    <rect x="176" y="196" width="48" height="9" rx="4.5" fill="#1d1633" opacity="0.45"/>
  </g>
</svg>
