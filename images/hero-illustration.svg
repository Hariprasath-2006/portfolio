<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="55%" stop-color="#8E6BF0"/>
      <stop offset="100%" stop-color="#FF7EB3"/>
    </linearGradient>
    <linearGradient id="winGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2145"/>
      <stop offset="100%" stop-color="#1d1633"/>
    </linearGradient>
  </defs>

  <!-- vibrant background -->
  <rect x="0" y="0" width="400" height="320" rx="18" fill="url(#bgGrad2)"/>

  <!-- floating bright shapes behind the window -->
  <circle cx="355" cy="40" r="30" fill="#FFD93D" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,12; 0,0" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="35" cy="285" r="22" fill="#00D2A0" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <rect x="330" y="255" width="26" height="26" rx="7" fill="#FF6B6B" opacity="0.9" transform="rotate(15 343 268)">
    <animateTransform attributeName="transform" type="rotate" values="15 343 268; -10 343 268; 15 343 268" dur="4.5s" repeatCount="indefinite" additive="sum"/>
  </rect>

  <!-- editor window -->
  <rect x="24" y="24" width="352" height="272" rx="16" fill="url(#winGrad2)"/>

  <!-- title bar -->
  <rect x="24" y="24" width="352" height="34" rx="16" fill="#000000" opacity="0.2"/>
  <circle cx="46" cy="41" r="5.5" fill="#FF6B6B"/>
  <circle cx="64" cy="41" r="5.5" fill="#FFD93D"/>
  <circle cx="82" cy="41" r="5.5" fill="#00D2A0"/>
  <text x="200" y="45" text-anchor="middle" font-family="monospace" font-size="11" fill="#c9b8f5">portfolio.js</text>

  <!-- animated code lines -->
  <g font-family="monospace" font-size="14">
    <text x="60" y="90" fill="#FF9FE5">
      const <tspan fill="#FFD93D">developer</tspan> <tspan fill="#e6dcff">=</tspan> {
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;0.15" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="112" fill="#7EE8FA">
      role<tspan fill="#e6dcff">:</tspan> <tspan fill="#A6FF9E">"Software Developer"</tspan><tspan fill="#e6dcff">,</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2;0.3" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="134" fill="#7EE8FA">
      stack<tspan fill="#e6dcff">:</tspan> <tspan fill="#A6FF9E">["React", "Flask", "Python"]</tspan><tspan fill="#e6dcff">,</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.35;0.45" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="156" fill="#7EE8FA">
      learning<tspan fill="#e6dcff">:</tspan> <tspan fill="#FFD93D">true</tspan><tspan fill="#e6dcff">,</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;0.6" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="178" fill="#7EE8FA">
      hireable<tspan fill="#e6dcff">:</tspan> <tspan fill="#FFD93D">true</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.65;0.75" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="200" fill="#FF9FE5">
      };
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8;0.9" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="100" y="212" width="9" height="14" fill="#7EE8FA">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
